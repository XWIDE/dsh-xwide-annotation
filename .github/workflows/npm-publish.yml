name: Publish to npm

# 用 GitHub OIDC 做 npm Trusted Publishing：不需要 NPM_TOKEN，也不受 npm 的 2FA 发布政策拦。
# ⚠️ npm 没有 pending publisher：**新包不能靠 OIDC 首发**（trusted publishing 要求包已存在）。
# 首发要本机 `npm login` + `npm publish`（账号需 2FA），或 `npm stage publish`（npm>=11.15）后在网页用 2FA 批准。
# 包一旦存在并配好 publisher，之后每个 tag 都由本 workflow 自动发。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24：自带的 npm 11.x 才支持 trusted publishing。
          # npm < 11.5.1 走 OIDC 发布时会报出误导性的 E404（不是包不存在）。
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Require npm >= 11.5.1 (trusted publishing floor)
        run: |
          V=$(npm -v)
          echo "npm $V"
          if [ "$(printf '%s\n' 11.5.1 "$V" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "npm $V is below 11.5.1 -> trusted publishing would fail with a misleading E404"
            exit 1
          fi

      # 纯静态插件，无运行时依赖（cordis 是 peerDependency），不装 node_modules
      - name: Syntax gate
        run: |
          node --check client.js
          node --check lib/index.js

      - name: What goes into the tarball
        run: npm pack --dry-run

      - name: Publish (trusted publishing, no token)
        run: npm publish --provenance --access public
