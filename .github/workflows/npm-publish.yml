name: Publish to npm

# 用 GitHub OIDC 做 npm Trusted Publishing：不需要 NPM_TOKEN，也不受 npm 的 2FA 发布政策拦。
# 首次运行会在 npm 侧生成一个「pending publisher」，需要包主在 npmjs.com 上点一次批准，然后重跑即可发布。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # 纯静态插件，无运行时依赖（cordis 是 peerDependency），不装 node_modules
      - name: Syntax gate
        run: |
          node --check client.js
          node --check lib/index.js

      - name: What goes into the tarball
        run: npm pack --dry-run

      - name: Publish (trusted publishing, no token)
        run: npm publish --provenance --access public
